spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: false
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: test
            client-secret: test
            redirect-uri: http://localhost:8080/login/oauth2/code/github
            scope: user:email
          slack:
            client-id: test
            client-secret: test
            redirect-uri: http://localhost:8080/login/oauth2/code/slack

jwt:
  secret-key: dGVzdC1zZWNyZXQta2V5LWZvci1pbnRlZ3JhdGlvbi10ZXN0LTEyMzQ1Njc4OTA=
  access-token-validity: 3600000
  refresh-token-validity: 604800000

logging:
  level:
    org.springframework.security: DEBUG
    com.blackcompany.eeos: DEBUG
