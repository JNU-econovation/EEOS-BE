version: '3.1'
services:
  nginx-proxy:
    container_name: nginx-proxy
    depends_on:
      - eeos-backend
    image: nginx:latest
    ports:
      - "50001:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
    environment:
      - DEV_SERVER_IP=${DEV_SERVER_IP}
    restart: always
    networks:
      - external-network
    command: >
      /bin/sh -c "envsubst '$$DEV_SERVER_IP' < /etc/nginx/templates/nginx.conf.template > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"
  eeos-mysql:
    container_name: eeos-mysql
    image: mysql/mysql-server:8.0.32
    environment:
      - MYSQL_DATABASE=eeos
      - MYSQL_ROOT_HOST=%
      - MYSQL_ROOT_PASSWORD=root
    command: [ "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--skip-character-set-client-handshake", "--lower_case_table_names=1", "--max_connections=2048", "--wait_timeout=3600" ]
    expose:
      - "3306"
    volumes:
      - ./resources/local-develop-environment/mysql-data:/var/lib/mysql
    restart: always
    networks:
      - internal-network
  eeos-flyway:
    container_name: eeos-flyway
    image: flyway/flyway:latest
    command: [
      "-url=jdbc:mysql://eeos-mysql:3306/eeos?useSSL=false&allowPublicKeyRetrieval=true",
      "-user=root",
      "-password=root",
      "-connectRetries=60",
      "migrate"
    ]
    volumes:
      - ./src/main/resources/db/migration/:/flyway/sql
    networks:
      - internal-network
    depends_on:
      - eeos-mysql
  eeos-redis:
    container_name: eeos-redis
    image: redis:latest
    expose:
      - "6379"
    environment:
      - REDIS_PASSWORD=root
    restart: always
    networks:
      - internal-network
  eeos-backend:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: eeos-backend
    ports:
      - "8080:8080"
    depends_on:
      - eeos-mysql
      - eeos-flyway
      - eeos-redis
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://eeos-mysql:3306/eeos?useSSL=false&serverTimezone=Asia/Seoul&useLegacyDatetimeCode=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_PROFILES_ACTIVE: dev
      SPRING_REDIS_HOST: eeos-redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: root
    networks:
      - internal-network
      - external-network

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml.template:ro
      - prometheus-data:/prometheus
    environment:
      - PROD_SERVER_IP=${PROD_SERVER_IP}
    entrypoint: /bin/sh
    command: >
      -c "apk add --no-cache gettext && envsubst '$$PROD_SERVER_IP' < /etc/prometheus/prometheus.yml.template > /etc/prometheus/prometheus.yml && /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --web.enable-lifecycle"
    restart: always
    networks:
      - internal-network
      - external-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: always
    networks:
      - internal-network
      - external-network

networks:
  internal-network:
  external-network:

volumes:
  prometheus-data:
  grafana-data:
